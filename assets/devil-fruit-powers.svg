<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* ]]> */
    </style>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="8" y="8" width="864" height="324" rx="8" fill="#171717"/>

  <!-- Main Canvas -->
  <rect x="0" y="0" width="864" height="324" rx="8" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(24, 20)">
    <rect x="4" y="4" width="816" height="36" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="816" height="36" rx="4" fill="#FF654F" stroke="#171717" stroke-width="2.5"/>
    <circle cx="20" cy="18" r="6" fill="#F5D547" stroke="#171717" stroke-width="1.5"/>
    <text x="36" y="23" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1" class="impact-font">
      SECTION 03 // DEVIL FRUIT POWERS — THE DATA-DATA FRUIT (SUJI SUJI NO MI)
    </text>
    <text x="800" y="23" text-anchor="end" fill="#F5D547" font-size="10.5" font-weight="800" class="mono-font">
      PRIMARY CORE: PYTHON 3
    </text>
  </g>

  <!-- Left Column: Devil Fruit Illustration & Primary Seal (width: 250) -->
  <g transform="translate(24, 72)">
    <!-- Shadow -->
    <rect x="4" y="4" width="240" height="236" rx="6" fill="#171717"/>
    <!-- Card -->
    <rect x="0" y="0" width="240" height="236" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>

    <!-- Stylized Devil Fruit Icon (Neo-Brutalist Geometric with Spirals) -->
    <g transform="translate(120, 95)">
      <!-- Fruit Body: Circular melon with swirls -->
      <circle cx="0" cy="0" r="48" fill="#F5D547" stroke="#171717" stroke-width="3"/>
      
      <!-- Swirl lines on fruit -->
      <path d="M -20 -15 Q -10 -30 5 -20 Q 20 -10 10 15" fill="none" stroke="#171717" stroke-width="2.5"/>
      <path d="M -30 5 Q -15 25 15 15 Q 30 5 20 -15" fill="none" stroke="#171717" stroke-width="2.5"/>
      <circle cx="-12" cy="-6" r="6" fill="#FF654F" stroke="#171717" stroke-width="1.5"/>
      <circle cx="14" cy="8" r="8" fill="#55C8E8" stroke="#171717" stroke-width="1.5"/>
      <circle cx="2" cy="-18" r="5" fill="#8BCB88" stroke="#171717" stroke-width="1.5"/>

      <!-- Stem & Curl -->
      <path d="M 0 -48 Q 5 -65 20 -60 Q 30 -55 25 -45" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-12" cy="-52" rx="10" ry="5" fill="#8BCB88" stroke="#171717" stroke-width="2" transform="rotate(-30, -12, -52)"/>
    </g>

    <!-- Label Below Fruit -->
    <g transform="translate(120, 168)">
      <rect x="-95" y="-14" width="190" height="28" rx="4" fill="#F5D547" stroke="#171717" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#171717" font-size="12" font-weight="900" class="impact-font">
        PYTHON 3 CORE WEAPON
      </text>
    </g>
    <text x="120" y="205" text-anchor="middle" fill="#171717" font-size="10" font-weight="700" class="mono-font">
      ANALYTICAL ENGINE // S-RANK
    </text>
  </g>

  <!-- Right Column: 4 Core Analytical Powers (width: 560) -->
  <g transform="translate(284, 72)">
    <!-- Shadow -->
    <rect x="4" y="4" width="556" height="236" rx="6" fill="#171717"/>
    <!-- Card -->
    <rect x="0" y="0" width="556" height="236" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>

    <g transform="translate(18, 16)">
      <!-- Power 1: Python 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="520" height="44" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.8"/>
        <rect x="0" y="0" width="12" height="44" rx="2" fill="#38bdf8"/>
        <text x="22" y="18" fill="#171717" font-size="11" font-weight="900" class="mono-font">01 // PYTHON 3 CORE</text>
        <text x="22" y="34" fill="#171717" font-size="10" font-weight="600" class="sans-font">Object-oriented design, algorithmic computation &amp; workflow automation.</text>
        <rect x="420" y="10" width="88" height="22" rx="3" fill="#38bdf8" stroke="#171717" stroke-width="1.2"/>
        <text x="464" y="24" text-anchor="middle" fill="#171717" font-size="9" font-weight="800" class="mono-font">FOUNDATION</text>
      </g>

      <!-- Power 2: Pandas -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="520" height="44" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.8"/>
        <rect x="0" y="0" width="12" height="44" rx="2" fill="#F5D547"/>
        <text x="22" y="18" fill="#171717" font-size="11" font-weight="900" class="mono-font">02 // PANDAS DATA MATRIX</text>
        <text x="22" y="34" fill="#171717" font-size="10" font-weight="600" class="sans-font">High-performance DataFrame operations, cleaning, vector wrangling &amp; transforms.</text>
        <rect x="420" y="10" width="88" height="22" rx="3" fill="#F5D547" stroke="#171717" stroke-width="1.2"/>
        <text x="464" y="24" text-anchor="middle" fill="#171717" font-size="9" font-weight="800" class="mono-font">VECTORIZED</text>
      </g>

      <!-- Power 3: Matplotlib -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="520" height="44" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.8"/>
        <rect x="0" y="0" width="12" height="44" rx="2" fill="#FF654F"/>
        <text x="22" y="18" fill="#171717" font-size="11" font-weight="900" class="mono-font">03 // MATPLOTLIB OPTICS</text>
        <text x="22" y="34" fill="#171717" font-size="10" font-weight="600" class="sans-font">Quantitative visual analytics, mathematical distribution curves &amp; data plotting.</text>
        <rect x="420" y="10" width="88" height="22" rx="3" fill="#FF654F" stroke="#171717" stroke-width="1.2"/>
        <text x="464" y="24" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" class="mono-font">PERCEPTION</text>
      </g>

      <!-- Power 4: Jupyter Notebook -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="520" height="44" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.8"/>
        <rect x="0" y="0" width="12" height="44" rx="2" fill="#8BCB88"/>
        <text x="22" y="18" fill="#171717" font-size="11" font-weight="900" class="mono-font">04 // JUPYTER RESEARCH LAB</text>
        <text x="22" y="34" fill="#171717" font-size="10" font-weight="600" class="sans-font">Interactive Machine Learning exploration, iterative prototyping &amp; EDA experiments.</text>
        <rect x="420" y="10" width="88" height="22" rx="3" fill="#8BCB88" stroke="#171717" stroke-width="1.2"/>
        <text x="464" y="24" text-anchor="middle" fill="#171717" font-size="9" font-weight="800" class="mono-font">LABORATORY</text>
      </g>
    </g>
  </g>
</svg>