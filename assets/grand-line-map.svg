    <circle cx="22" cy="21" r="7" fill="#171717"/>
    <text x="38" y="27" fill="#171717" font-size="14.5" font-weight="900" letter-spacing="1" class="impact-font">
      SECTION 09 // THE NEXT ISLAND — GRAND LINE ENGINEERING ROADMAP
    </text>
    <text x="820" y="26" text-anchor="end" fill="#171717" font-size="11" font-weight="900" class="mono-font">
      CHARTED DESTINATIONS: 06
    </text>
