      /* ]]> */
    </style>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="10" y="10" width="860" height="480" rx="10" fill="#171717"/>

  <!-- Main Canvas -->
  <rect x="0" y="0" width="860" height="480" rx="10" fill="#F4EBDD" stroke="#171717" stroke-width="4"/>

  <!-- Top Ribbon -->
  <g transform="translate(20, 18)">
    <rect x="4" y="4" width="840" height="42" rx="6" fill="#171717"/>
