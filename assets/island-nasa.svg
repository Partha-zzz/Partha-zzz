<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* ]]> */
    </style>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="8" y="8" width="864" height="134" rx="8" fill="#171717"/>

  <!-- Main Card Canvas -->
  <rect x="0" y="0" width="864" height="134" rx="8" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>
  <rect x="0" y="0" width="10" height="134" rx="3" fill="#F5D547"/>

  <!-- Left Content Column -->
  <g transform="translate(26, 22)">
    <!-- Island Log Marker -->
    <text x="0" y="0" fill="#171717" font-size="10.5" font-weight="900" letter-spacing="1.5" class="mono-font">
      ISLAND 01 // COSMOS EXPEDITION ✦ 3D PLANETARY ENVIRONMENTS
    </text>

    <!-- Title -->
    <text x="0" y="26" fill="#171717" font-size="20" font-weight="900" letter-spacing="0.5" class="impact-font">
      THE TALE OF NASA'S FORGOTTEN LEGACY
    </text>

    <!-- Description -->
    <text x="0" y="52" fill="#222222" font-size="11.5" font-weight="600" class="sans-font">
      An immersive educational storytelling experience exploring NASA's forgotten equipment on the Moon and Mars.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 72)">
      
        <g transform="translate(0, 0)">
          <rect x="2" y="2" width="72.5" height="22" rx="3" fill="#171717"/>
          <rect x="0" y="0" width="72.5" height="22" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
          <text x="36.25" y="15" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" font-family="'Fira Code', monospace">Next.js</text>
        </g>
        <g transform="translate(80.5, 0)">
          <rect x="2" y="2" width="80.0" height="22" rx="3" fill="#171717"/>
          <rect x="0" y="0" width="80.0" height="22" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
          <text x="40.0" y="15" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" font-family="'Fira Code', monospace">Three.js</text>
        </g>
        <g transform="translate(168.5, 0)">
          <rect x="2" y="2" width="110.0" height="22" rx="3" fill="#171717"/>
          <rect x="0" y="0" width="110.0" height="22" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
          <text x="55.0" y="15" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" font-family="'Fira Code', monospace">Tailwind CSS</text>
        </g>
        <g transform="translate(286.5, 0)">
          <rect x="2" y="2" width="80.0" height="22" rx="3" fill="#171717"/>
          <rect x="0" y="0" width="80.0" height="22" rx="3" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
          <text x="40.0" y="15" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" font-family="'Fira Code', monospace">3D WebGL</text>
        </g>
    </g>
  </g>

  <!-- Right Action Column: Island Destination Stamp & Button -->
  <g transform="translate(670, 24)">
    <!-- Stamp -->
    <rect x="2" y="2" width="176" height="26" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="176" height="26" rx="4" fill="#F5D547" stroke="#171717" stroke-width="1.8"/>
    <text x="88" y="17" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="900" class="mono-font">
      STATUS: EXPLORED ⚓
    </text>

    <!-- Set Sail Button -->
    <g transform="translate(0, 42)">
      <rect x="4" y="4" width="176" height="44" rx="6" fill="#171717"/>
      <rect x="0" y="0" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>
      <text x="88" y="27" text-anchor="middle" fill="#171717" font-size="12" font-weight="900" letter-spacing="0.8" class="impact-font">
        🏴‍☠️ SET SAIL TO ISLAND
      </text>
    </g>
  </g>
</svg>