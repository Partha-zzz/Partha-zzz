<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* ]]> */
    </style>
    <!-- Pattern for sea background -->
    <pattern id="seaPattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 0 20 10 T 40 10" fill="none" stroke="#2baed4" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Ocean Background -->
  <rect width="900" height="320" fill="#55C8E8"/>
  <rect width="900" height="320" fill="url(#seaPattern)" opacity="0.4"/>
  <rect width="900" height="320" fill="none" stroke="#171717" stroke-width="4"/>

  <!-- Top Yellow Accent Header Ribbon -->
  <!-- Shadow -->
  <rect x="26" y="24" width="852" height="32" rx="4" fill="#171717"/>
  <!-- Ribbon -->
  <rect x="20" y="18" width="852" height="32" rx="4" fill="#F5D547" stroke="#171717" stroke-width="3"/>
  <circle cx="36" cy="34" r="5" fill="#FF654F" stroke="#171717" stroke-width="1.5"/>
  <text x="50" y="38" fill="#171717" font-size="12" font-weight="800" letter-spacing="1.5" class="mono-font">
    LOG POSE // DESTINATION: THE GRAND LINE OF TECHNOLOGY ✦ SPECIAL ISSUE
  </text>
  <text x="856" y="38" text-anchor="end" fill="#171717" font-size="11" font-weight="700" class="mono-font">
    HALDIA, WEST BENGAL
  </text>

  <!-- Main Central Journal Box -->
  <!-- Hard Shadow -->
  <g transform="translate(8, 8)">
    <rect x="36" y="72" width="820" height="216" rx="6" fill="#171717"/>
  </g>
  <!-- Main Box -->
  <rect x="36" y="72" width="820" height="216" rx="6" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>

  <!-- Corner Rivets / Nails -->
  <circle cx="48" cy="84" r="3.5" fill="#171717"/>
  <circle cx="844" cy="84" r="3.5" fill="#171717"/>
  <circle cx="48" cy="276" r="3.5" fill="#171717"/>
  <circle cx="844" cy="276" r="3.5" fill="#171717"/>

  <!-- Main Heading -->
  <g transform="translate(60, 118)">
    <text x="0" y="0" fill="#FF654F" font-size="28" font-weight="900" letter-spacing="2" class="impact-font">
      THE GRAND LINE OF TECHNOLOGY
    </text>
    <text x="0" y="36" fill="#171717" font-size="34" font-weight="900" letter-spacing="1" class="impact-font">
      PARTHA SARATHI SARKAR
    </text>
  </g>

  <!-- Subtitle Tagline Pill -->
  <!-- Shadow -->
  <g transform="translate(64, 178)">
    <rect x="4" y="4" width="370" height="34" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="370" height="34" rx="4" fill="#F5D547" stroke="#171717" stroke-width="2.5"/>
    <text x="185" y="22" text-anchor="middle" fill="#171717" font-size="14" font-weight="900" letter-spacing="1.2" class="impact-font">
      ★ THE ARCHITECT OF POSSIBILITIES ★
    </text>
  </g>

  <!-- Tagline Text -->
  <text x="430" y="200" fill="#171717" font-size="11" font-weight="700" font-style="italic" class="sans-font">
    "The next island is always waiting. Build with freedom."
  </text>

  <!-- Bottom Badges / Stickers -->
  <g transform="translate(60, 234)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect x="4" y="4" width="220" height="32" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="220" height="32" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>
      <text x="110" y="20" text-anchor="middle" fill="#171717" font-size="11" font-weight="800" class="mono-font">
        ⚓ CSE – AI &amp; ML STUDENT
      </text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(236, 0)">
      <rect x="4" y="4" width="240" height="32" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="240" height="32" rx="4" fill="#8BCB88" stroke="#171717" stroke-width="2.5"/>
      <text x="120" y="20" text-anchor="middle" fill="#171717" font-size="11" font-weight="800" class="mono-font">
        📊 DATA SCIENCE &amp; ML
      </text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(492, 0)">
      <rect x="4" y="4" width="260" height="32" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="260" height="32" rx="4" fill="#55C8E8" stroke="#171717" stroke-width="2.5"/>
      <text x="130" y="20" text-anchor="middle" fill="#171717" font-size="11" font-weight="800" class="mono-font">
        🤖 AI-ASSISTED ARCHITECT
      </text>
    </g>
  </g>

  <!-- Decorative Pirate Straw Hat / Anchor Stamp in Upper Right -->
  <g transform="translate(740, 105) rotate(4)">
    <rect x="4" y="4" width="100" height="52" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="100" height="52" rx="4" fill="#FF654F" stroke="#171717" stroke-width="2.5"/>
    <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" class="impact-font">
      STRAW HAT
    </text>
    <text x="50" y="40" text-anchor="middle" fill="#F5D547" font-size="10" font-weight="800" class="mono-font">
      PIRATE CREW
    </text>
  </g>
</svg>