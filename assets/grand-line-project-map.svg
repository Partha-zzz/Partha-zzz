<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 440" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes shipVoyage {
        0%   { transform: translate(120px, 260px) rotate(-8deg); }
        35%  { transform: translate(380px, 210px) rotate(4deg); }
        70%  { transform: translate(650px, 240px) rotate(-5deg); }
        100% { transform: translate(120px, 260px) rotate(-8deg); }
      }
      .island-hover:hover {
        filter: drop-shadow(4px 4px 0px #171717);
        cursor: pointer;
      }
      /* ]]> */
    </style>
    <!-- Ocean wave pattern -->
    <pattern id="seaWaves" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 5 20 10 T 40 10" fill="none" stroke="#2baed4" stroke-width="1.2" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="8" y="8" width="864" height="424" rx="8" fill="#171717"/>

  <!-- Main Map Canvas -->
  <rect x="0" y="0" width="864" height="424" rx="8" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>
  <rect x="4" y="4" width="856" height="416" fill="url(#seaWaves)"/>

  <!-- Top Ribbon Banner -->
  <g transform="translate(24, 18)">
    <rect x="4" y="4" width="816" height="36" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="816" height="36" rx="4" fill="#F5D547" stroke="#171717" stroke-width="2.5"/>
    <circle cx="20" cy="18" r="6" fill="#FF654F" stroke="#171717" stroke-width="1.5"/>
    <text x="36" y="23" fill="#171717" font-size="13" font-weight="900" letter-spacing="1" class="impact-font">
      THE GRAND LINE // CHARTED ISLANDS &amp; MAJOR EXPEDITIONS
    </text>
    <text x="800" y="23" text-anchor="end" fill="#171717" font-size="10.5" font-weight="800" class="mono-font">
      3 CONQUERED TERRITORIES
    </text>
  </g>

  <!-- Compass Rose in Top-Left -->
  <g transform="translate(70, 95)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
    <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="#FF654F" stroke="#171717" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#F5D547" stroke="#171717" stroke-width="1"/>
    <text x="0" y="-26" text-anchor="middle" fill="#171717" font-size="9" font-weight="900" class="mono-font">N</text>
  </g>

  <!-- Dotted Sea Voyage Route Line -->
  <path d="M 160 210 Q 280 140 430 200 T 700 190" fill="none" stroke="#171717" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- ══════ ISLAND 01: NASA FORGOTTEN LEGACY ══════ -->
  <a xlink:href="https://the-tale-of-nasa-s-forgotten-legacy.vercel.app" target="_blank">
    <g transform="translate(40, 150)" class="island-hover">
      <!-- Island Base Card -->
      <rect x="4" y="4" width="245" height="235" rx="6" fill="#171717"/>
      <rect x="0" y="0" width="245" height="235" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>
      <rect x="0" y="0" width="245" height="28" rx="4" fill="#F5D547" stroke="#171717" stroke-width="1.8"/>
      <text x="12" y="18" fill="#171717" font-size="10" font-weight="900" class="impact-font">ISLAND 01 // COSMOS ORBIT</text>

      <!-- Island Artwork: Moon & Mars Orbit -->
      <g transform="translate(122, 75)">
        <circle cx="0" cy="0" r="32" fill="#EADBC8" stroke="#171717" stroke-width="2"/>
        <circle cx="-10" cy="-8" r="6" fill="#D3C3AF"/>
        <circle cx="12" cy="10" r="8" fill="#D3C3AF"/>
        <!-- Ring -->
        <ellipse cx="0" cy="0" rx="46" ry="12" fill="none" stroke="#55C8E8" stroke-width="2.5" transform="rotate(-15)"/>
        <!-- Satellite / Rover -->
        <rect x="22" y="-18" width="12" height="8" fill="#FF654F" stroke="#171717" stroke-width="1"/>
      </g>

      <!-- Content -->
      <text x="12" y="130" fill="#171717" font-size="12" font-weight="900" class="impact-font">NASA'S FORGOTTEN LEGACY</text>
      <text x="12" y="148" fill="#333333" font-size="9" font-weight="600" class="sans-font">3D cosmos storytelling platform</text>
      <text x="12" y="162" fill="#333333" font-size="9" font-weight="600" class="sans-font">exploring Moon &amp; Mars gear.</text>

      <!-- Tech Tags -->
      <g transform="translate(12, 175)">
        <rect x="0" y="0" width="55" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="27.5" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Next.js</text>
        <rect x="60" y="0" width="58" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="89" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Three.js</text>
        <rect x="123" y="0" width="52" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="149" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">WebGL</text>
      </g>

      <!-- Button -->
      <g transform="translate(12, 200)">
        <rect x="2" y="2" width="221" height="24" rx="3" fill="#171717"/>
        <rect x="0" y="0" width="221" height="24" rx="3" fill="#F5D547" stroke="#171717" stroke-width="1.5"/>
        <text x="110" y="16" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="900" class="impact-font">🏴‍☠️ SET SAIL TO ISLAND 01</text>
      </g>
    </g>
  </a>

  <!-- ══════ ISLAND 02: EXPLOITREPLAY ══════ -->
  <a xlink:href="https://exploitreplay.vercel.app" target="_blank">
    <g transform="translate(315, 150)" class="island-hover">
      <!-- Island Base Card -->
      <rect x="4" y="4" width="245" height="235" rx="6" fill="#171717"/>
      <rect x="0" y="0" width="245" height="235" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>
      <rect x="0" y="0" width="245" height="28" rx="4" fill="#55C8E8" stroke="#171717" stroke-width="1.8"/>
      <text x="12" y="18" fill="#171717" font-size="10" font-weight="900" class="impact-font">ISLAND 02 // CYBER FORTRESS</text>

      <!-- Island Artwork: Security Shield & Terminal -->
      <g transform="translate(122, 75)">
        <!-- Shield -->
        <path d="M 0 -28 L 26 -16 L 26 8 Q 0 32 -26 8 L -26 -16 Z" fill="#55C8E8" stroke="#171717" stroke-width="2"/>
        <path d="M 0 -22 L 20 -12 L 20 6 Q 0 26 -20 6 L -20 -12 Z" fill="#FFFFFF" stroke="#171717" stroke-width="1.2"/>
        <!-- Terminal prompt / Lock -->
        <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#171717"/>
        <path d="M -6 -8 Q -6 -16 0 -16 Q 6 -16 6 -8" fill="none" stroke="#171717" stroke-width="2"/>
        <circle cx="0" cy="0" r="2.5" fill="#F5D547"/>
      </g>

      <!-- Content -->
      <text x="12" y="130" fill="#171717" font-size="12" font-weight="900" class="impact-font">EXPLOITREPLAY PLATFORM</text>
      <text x="12" y="148" fill="#333333" font-size="9" font-weight="600" class="sans-font">Automated vulnerability reproduction</text>
      <text x="12" y="162" fill="#333333" font-size="9" font-weight="600" class="sans-font">&amp; exploit sandbox analysis.</text>

      <!-- Tech Tags -->
      <g transform="translate(12, 175)">
        <rect x="0" y="0" width="60" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="30" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Python 3</text>
        <rect x="66" y="0" width="55" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="93.5" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Security</text>
        <rect x="126" y="0" width="55" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="153.5" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Sandbox</text>
      </g>

      <!-- Button -->
      <g transform="translate(12, 200)">
        <rect x="2" y="2" width="221" height="24" rx="3" fill="#171717"/>
        <rect x="0" y="0" width="221" height="24" rx="3" fill="#55C8E8" stroke="#171717" stroke-width="1.5"/>
        <text x="110" y="16" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="900" class="impact-font">⚔️ INSPECT LOGBOOK 02</text>
      </g>
    </g>
  </a>

  <!-- ══════ ISLAND 03: RESQAI ══════ -->
  <a xlink:href="https://resqai-mdo4.onrender.com" target="_blank">
    <g transform="translate(590, 150)" class="island-hover">
      <!-- Island Base Card -->
      <rect x="4" y="4" width="245" height="235" rx="6" fill="#171717"/>
      <rect x="0" y="0" width="245" height="235" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>
      <rect x="0" y="0" width="245" height="28" rx="4" fill="#FF654F" stroke="#171717" stroke-width="1.8"/>
      <text x="12" y="18" fill="#FFFFFF" font-size="10" font-weight="900" class="impact-font">ISLAND 03 // CRISIS DISPATCH</text>

      <!-- Island Artwork: Emergency Cross & Signal Beacon -->
      <g transform="translate(122, 75)">
        <!-- Beacon / Emergency Signal -->
        <circle cx="0" cy="0" r="30" fill="#FF654F" stroke="#171717" stroke-width="2"/>
        <!-- White Cross -->
        <rect x="-6" y="-18" width="12" height="36" fill="#FFFFFF" rx="2"/>
        <rect x="-18" y="-6" width="36" height="12" fill="#FFFFFF" rx="2"/>
        <!-- Pulse waves -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="#FF654F" stroke-width="1.5" stroke-dasharray="4 4"/>
      </g>

      <!-- Content -->
      <text x="12" y="130" fill="#171717" font-size="12" font-weight="900" class="impact-font">RESQAI COORDINATION</text>
      <text x="12" y="148" fill="#333333" font-size="9" font-weight="600" class="sans-font">AI-driven emergency response</text>
      <text x="12" y="162" fill="#333333" font-size="9" font-weight="600" class="sans-font">&amp; rapid disaster resource dispatch.</text>

      <!-- Tech Tags -->
      <g transform="translate(12, 175)">
        <rect x="0" y="0" width="55" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="27.5" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Next.js</text>
        <rect x="60" y="0" width="55" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="87.5" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">AI Flow</text>
        <rect x="120" y="0" width="58" height="18" rx="2" fill="#F4EBDD" stroke="#171717" stroke-width="1"/>
        <text x="149" y="12" text-anchor="middle" fill="#171717" font-size="8" font-weight="700" class="mono-font">Supabase</text>
      </g>

      <!-- Button -->
      <g transform="translate(12, 200)">
        <rect x="2" y="2" width="221" height="24" rx="3" fill="#171717"/>
        <rect x="0" y="0" width="221" height="24" rx="3" fill="#FF654F" stroke="#171717" stroke-width="1.5"/>
        <text x="110" y="16" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="900" class="impact-font">🚨 DISPATCH RESCUE 03</text>
      </g>
    </g>
  </a>

  <!-- Animated Thousand Sunny Sailing Between Islands -->
  <g style="animation: shipVoyage 20s ease-in-out infinite;">
    <g transform="translate(0, 0)">
      <!-- Ship Hull -->
      <path d="M 0 12 L 6 22 L 28 22 L 34 12 Z" fill="#F5D547" stroke="#171717" stroke-width="1.8"/>
      <!-- Mast & Sail -->
      <line x1="17" y1="2" x2="17" y2="12" stroke="#171717" stroke-width="1.8"/>
      <path d="M 17 2 Q 26 6 17 11 Z" fill="#FFFFFF" stroke="#171717" stroke-width="1.2"/>
      <!-- Straw Hat Jolly Roger Flag -->
      <rect x="10" y="-1" width="7" height="4" fill="#171717"/>
    </g>
  </g>

  <!-- Sea Monster Silhouette Decoration in Deep Water -->
  <g transform="translate(520, 115) opacity(0.5)">
    <path d="M 0 0 Q 15 -14 30 0 Q 45 -14 60 0" fill="none" stroke="#171717" stroke-width="2"/>
    <text x="65" y="-5" fill="#171717" font-size="8" font-style="italic" class="mono-font">sea beast</text>
  </g>
</svg>