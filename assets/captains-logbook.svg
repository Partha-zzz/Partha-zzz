<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* ]]> */
    </style>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="8" y="8" width="864" height="214" rx="8" fill="#171717"/>

  <!-- Main Canvas -->
  <rect x="0" y="0" width="864" height="214" rx="8" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(24, 20)">
    <rect x="4" y="4" width="816" height="34" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="816" height="34" rx="4" fill="#F5D547" stroke="#171717" stroke-width="2.5"/>
    <circle cx="20" cy="17" r="6" fill="#171717"/>
    <text x="36" y="22" fill="#171717" font-size="12.5" font-weight="900" letter-spacing="1" class="impact-font">
      SECTION 07 // THE CAPTAIN'S LOGBOOK — REAL-TIME GITHUB NAVIGATION STATS
    </text>
    <text x="800" y="22" text-anchor="end" fill="#171717" font-size="10" font-weight="800" class="mono-font">
      LOG ID: PARTHA-ZZZ
    </text>
  </g>

  <!-- Left Column: 4 Stat Boxes (width: 440) -->
  <g transform="translate(24, 68)">
    <!-- Box 1: Contributions -->
    <g transform="translate(0, 0)">
      <rect x="3" y="3" width="195" height="60" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="195" height="60" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
      <text x="14" y="20" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">TOTAL CONTRIBUTIONS</text>
      <text x="14" y="48" fill="#FF654F" font-size="24" font-weight="900" class="impact-font">352+</text>
      <text x="80" y="46" fill="#555555" font-size="9" font-weight="700" class="mono-font">CONQUERED</text>
    </g>

    <!-- Box 2: Public Repos -->
    <g transform="translate(210, 0)">
      <rect x="3" y="3" width="195" height="60" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="195" height="60" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
      <text x="14" y="20" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">PUBLIC ISLANDS (REPOS)</text>
      <text x="14" y="48" fill="#55C8E8" font-size="24" font-weight="900" class="impact-font">11</text>
      <text x="56" y="46" fill="#555555" font-size="9" font-weight="700" class="mono-font">REPOSITORIES</text>
    </g>

    <!-- Box 3: Followers -->
    <g transform="translate(0, 72)">
      <rect x="3" y="3" width="195" height="60" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="195" height="60" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
      <text x="14" y="20" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">CREW MEMBERS (FOLLOWERS)</text>
      <text x="14" y="48" fill="#8BCB88" font-size="24" font-weight="900" class="impact-font">6</text>
      <text x="44" y="46" fill="#555555" font-size="9" font-weight="700" class="mono-font">HUNTERS &amp; PIRATES</text>
    </g>

    <!-- Box 4: Current Voyage Status -->
    <g transform="translate(210, 72)">
      <rect x="3" y="3" width="195" height="60" rx="4" fill="#171717"/>
      <rect x="0" y="0" width="195" height="60" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
      <text x="14" y="20" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">VOYAGE CLASSIFICATION</text>
      <text x="14" y="46" fill="#F5D547" font-size="14.5" font-weight="900" class="impact-font">S-RANK ARCHITECT</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="446" y1="68" x2="446" y2="204" stroke="#171717" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Right Column: Top Languages (width: 380) -->
  <g transform="translate(468, 68)">
    <rect x="3" y="3" width="372" height="132" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="372" height="132" rx="4" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>

    <g transform="translate(16, 18)">
      <text x="0" y="0" fill="#171717" font-size="11" font-weight="900" letter-spacing="0.8" class="impact-font">
        TOP CODE LANGUAGES IN LOGBOOK
      </text>

      <!-- Python -->
      <g transform="translate(0, 16)">
        <text x="0" y="10" fill="#171717" font-size="10" font-weight="800" class="mono-font">Python</text>
        <text x="340" y="10" text-anchor="end" fill="#171717" font-size="10" font-weight="900" class="mono-font">33.3%</text>
        <rect x="0" y="15" width="340" height="8" rx="2" fill="#EADBC8" stroke="#171717" stroke-width="1"/>
        <rect x="0" y="15" width="114" height="8" rx="2" fill="#3572A5"/>
      </g>

      <!-- Jupyter -->
      <g transform="translate(0, 44)">
        <text x="0" y="10" fill="#171717" font-size="10" font-weight="800" class="mono-font">Jupyter Notebook</text>
        <text x="340" y="10" text-anchor="end" fill="#171717" font-size="10" font-weight="900" class="mono-font">33.3%</text>
        <rect x="0" y="15" width="340" height="8" rx="2" fill="#EADBC8" stroke="#171717" stroke-width="1"/>
        <rect x="0" y="15" width="114" height="8" rx="2" fill="#DA5B0B"/>
      </g>

      <!-- TypeScript & Web -->
      <g transform="translate(0, 72)">
        <text x="0" y="10" fill="#171717" font-size="10" font-weight="800" class="mono-font">TypeScript &amp; Web</text>
        <text x="340" y="10" text-anchor="end" fill="#171717" font-size="10" font-weight="900" class="mono-font">33.4%</text>
        <rect x="0" y="15" width="340" height="8" rx="2" fill="#EADBC8" stroke="#171717" stroke-width="1"/>
        <rect x="0" y="15" width="114" height="8" rx="2" fill="#3178C6"/>
      </g>
    </g>
  </g>
</svg>