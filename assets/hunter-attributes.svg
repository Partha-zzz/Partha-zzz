<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      @keyframes borderPulse {
        0%, 100% { stroke: #7c3aed; filter: drop-shadow(0 0 4px #7c3aed); }
        50%      { stroke: #38bdf8; filter: drop-shadow(0 0 10px #38bdf8); }
      }
      @keyframes dotPulse {
        0%, 100% { r: 3; opacity: 0.6; }
        50%      { r: 4.5; opacity: 1; }
      }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      /* ]]> */
    </style>
    <radialGradient id="dashBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#14002e"/>
      <stop offset="60%"  stop-color="#080017"/>
      <stop offset="100%" stop-color="#020007"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="280" rx="12" fill="url(#dashBg)"/>
  <rect x="1.5" y="1.5" width="877" height="277" rx="10" fill="none" stroke-width="1.6" style="animation: borderPulse 4s ease-in-out infinite;"/>

  <!-- Top Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="3.5" fill="#38bdf8" style="animation: dotPulse 2s infinite;"/>
    <circle cx="6" cy="6" r="7" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <text x="22" y="10" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1" class="mono-font">
      [ HUNTER ATTRIBUTE MATRIX // COGNITIVE &amp; ARCHITECTURAL PROGRESSION ]
    </text>
    <text x="832" y="10" text-anchor="end" fill="#a855f7" font-size="10.5" font-weight="600" class="mono-font">
      TIER: S-RANK ARCHITECT
    </text>
    <line x1="0" y1="18" x2="832" y2="18" stroke="#4c1d95" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 6 Attribute Cards -->
  
    <!-- Card INT -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="268" height="100" rx="8" fill="#0d0221" stroke="#3b0764" stroke-width="0.8"/>
      <!-- Top header line inside card -->
      <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="22" y="20" fill="#38bdf8" font-size="11" font-weight="800" font-family="'Fira Code', monospace">INT</text>
      <text x="56" y="20" fill="#94a3b8" font-size="10" font-family="'Fira Code', monospace">// Analytical Thinking</text>

      <!-- Level Pill -->
      <rect x="173" y="9" width="85" height="18" rx="3" fill="#1b003a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="215.5" y="21.5" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700" font-family="'Fira Code', monospace">EXPANDING</text>

      <line x1="12" y1="34" x2="256" y2="34" stroke="#25084a" stroke-width="0.8"/>

      <!-- Description Line 1 & Line 2 -->
      <text x="14" y="52" fill="#cbd5e1" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CSE (AI &amp; ML) foundation,</text>
      <text x="14" y="68" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">mathematical intuition &amp; logic.</text>
    </g>
    <!-- Card CREA -->
    <g transform="translate(306, 55)">
      <rect x="0" y="0" width="268" height="100" rx="8" fill="#0d0221" stroke="#3b0764" stroke-width="0.8"/>
