      <!-- Top header line inside card -->
      <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="22" y="20" fill="#38bdf8" font-size="11" font-weight="800" font-family="'Fira Code', monospace">DEV</text>
      <text x="56" y="20" fill="#94a3b8" font-size="10" font-family="'Fira Code', monospace">// App Architecture</text>

      <!-- Level Pill -->
