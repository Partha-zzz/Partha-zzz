      <text x="14" y="52" fill="#cbd5e1" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Vector wrangling, EDA &amp;</text>
      <text x="14" y="68" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">distribution insights via Pandas.</text>
    </g>
    <!-- Card DEV -->
    <g transform="translate(306, 169)">
