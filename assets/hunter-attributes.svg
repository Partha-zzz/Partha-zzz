      <text x="215.5" y="21.5" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700" font-family="'Fira Code', monospace">ADVANCING</text>

      <line x1="12" y1="34" x2="256" y2="34" stroke="#25084a" stroke-width="0.8"/>

      <!-- Description Line 1 & Line 2 -->
      <text x="14" y="52" fill="#cbd5e1" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Orchestrating AI co-pilots</text>
      <text x="14" y="68" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">to accelerate architecture.</text>
    </g>
    <!-- Card DATA -->
    <g transform="translate(24, 169)">
      <rect x="0" y="0" width="268" height="100" rx="8" fill="#0d0221" stroke="#3b0764" stroke-width="0.8"/>
      <!-- Top header line inside card -->
      <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#a855f7" stroke-width="1.5"/>
      <text x="22" y="20" fill="#a855f7" font-size="11" font-weight="800" font-family="'Fira Code', monospace">DATA</text>
      <text x="56" y="20" fill="#94a3b8" font-size="10" font-family="'Fira Code', monospace">// Data Science</text>

