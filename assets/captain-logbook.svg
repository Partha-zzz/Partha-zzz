<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%">
  <defs>
    <style>
      /* <![CDATA[ */
      .impact-font { font-family: 'Impact', 'Arial Black', sans-serif; }
      .mono-font { font-family: 'Fira Code', 'Courier New', monospace; }
      .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* ]]> */
    </style>
  </defs>

  <!-- Hard Offset Shadow -->
  <rect x="8" y="8" width="864" height="354" rx="8" fill="#171717"/>

  <!-- Main Canvas -->
  <rect x="0" y="0" width="864" height="354" rx="8" fill="#F4EBDD" stroke="#171717" stroke-width="3.5"/>

  <!-- Header Banner -->
  <g transform="translate(24, 24)">
    <rect x="4" y="4" width="816" height="36" rx="4" fill="#171717"/>
    <rect x="0" y="0" width="816" height="36" rx="4" fill="#F5D547" stroke="#171717" stroke-width="2.5"/>
    <circle cx="20" cy="18" r="6" fill="#FF654F" stroke="#171717" stroke-width="1.5"/>
    <text x="36" y="23" fill="#171717" font-size="13" font-weight="900" letter-spacing="1" class="impact-font">
      SECTION 02 // THE MAN BEHIND THE STRAW HAT — CAPTAIN'S LOGBOOK
    </text>
    <text x="800" y="23" text-anchor="end" fill="#171717" font-size="10.5" font-weight="700" class="mono-font">
      ENTRY: LOG_2026
    </text>
  </g>

  <!-- Left Column: The Pirate Identity & Pitch (width: 440) -->
  <g transform="translate(24, 76)">
    <!-- Identity Card -->
    <!-- Shadow -->
    <rect x="4" y="4" width="450" height="250" rx="6" fill="#171717"/>
    <!-- Card -->
    <rect x="0" y="0" width="450" height="250" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>

    <g transform="translate(18, 22)">
      <text x="0" y="0" fill="#FF654F" font-size="12" font-weight="900" class="mono-font">
        ⚓ CAPTAIN'S PHILOSOPHY &amp; VOYAGE
      </text>

      <text x="0" y="28" fill="#171717" font-size="12" font-weight="700" font-style="italic" class="sans-font">
        "An aspiring AI and ML enthusiast who loves creating things,
      </text>
      <text x="0" y="46" fill="#171717" font-size="12" font-weight="700" font-style="italic" class="sans-font">
        exploring different cultures and turning ideas into meaningful
      </text>
      <text x="0" y="64" fill="#171717" font-size="12" font-weight="700" font-style="italic" class="sans-font">
        projects through technology."
      </text>

      <line x1="0" y1="82" x2="414" y2="82" stroke="#171717" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Academic & Direction -->
      <text x="0" y="104" fill="#171717" font-size="10.5" font-weight="800" class="mono-font">
        ACADEMIC DISCIPLINE :
      </text>
      <text x="160" y="104" fill="#171717" font-size="11" font-weight="600" class="sans-font">
        CSE (AI &amp; ML) Undergrad
      </text>

      <text x="0" y="128" fill="#171717" font-size="10.5" font-weight="800" class="mono-font">
        HOME PORT / BASE   :
      </text>
      <text x="160" y="128" fill="#171717" font-size="11" font-weight="600" class="sans-font">
        Haldia, West Bengal, India
      </text>

      <text x="0" y="152" fill="#171717" font-size="10.5" font-weight="800" class="mono-font">
        PROFESSIONAL PATH  :
      </text>
      <text x="160" y="152" fill="#171717" font-size="11" font-weight="600" class="sans-font">
        Data Scientist &amp; ML Engineer
      </text>

      <line x1="0" y1="170" x2="414" y2="170" stroke="#171717" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Core Interests Pills -->
      <g transform="translate(0, 184)">
        <rect x="0" y="0" width="130" height="24" rx="4" fill="#F5D547" stroke="#171717" stroke-width="1.5"/>
        <text x="65" y="16" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">💡 Building Things</text>

        <rect x="138" y="0" width="138" height="24" rx="4" fill="#55C8E8" stroke="#171717" stroke-width="1.5"/>
        <text x="207" y="16" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">🌏 World Cultures</text>

        <rect x="284" y="0" width="130" height="24" rx="4" fill="#8BCB88" stroke="#171717" stroke-width="1.5"/>
        <text x="349" y="16" text-anchor="middle" fill="#171717" font-size="9.5" font-weight="800" class="mono-font">🎵 Music Voyages</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Cultural & Language Compass (width: 350) -->
  <g transform="translate(492, 76)">
    <!-- Shadow -->
    <rect x="4" y="4" width="348" height="250" rx="6" fill="#171717"/>
    <!-- Card -->
    <rect x="0" y="0" width="348" height="250" rx="6" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/>

    <g transform="translate(18, 22)">
      <text x="0" y="0" fill="#55C8E8" font-size="12" font-weight="900" class="mono-font">
        🧭 MULTILINGUAL NAVIGATION &amp; HORIZON
      </text>

      <!-- English -->
      <g transform="translate(0, 18)">
        <rect x="0" y="0" width="312" height="34" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.5"/>
        <text x="14" y="21" fill="#171717" font-size="11" font-weight="800" class="mono-font">🇬🇧 English</text>
        <text x="300" y="21" text-anchor="end" fill="#171717" font-size="10" font-weight="700" class="mono-font">PROFESSIONAL</text>
      </g>

      <!-- Bengali -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="312" height="34" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.5"/>
        <text x="14" y="21" fill="#171717" font-size="11" font-weight="800" class="mono-font">🇮🇳 Bengali (বাংলা)</text>
        <text x="300" y="21" text-anchor="end" fill="#171717" font-size="10" font-weight="700" class="mono-font">NATIVE HERITAGE</text>
      </g>

      <!-- Hindi -->
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="312" height="34" rx="4" fill="#F4EBDD" stroke="#171717" stroke-width="1.5"/>
        <text x="14" y="21" fill="#171717" font-size="11" font-weight="800" class="mono-font">🇮🇳 Hindi (हिन्दी)</text>
        <text x="300" y="21" text-anchor="end" fill="#171717" font-size="10" font-weight="700" class="mono-font">FLUENT</text>
      </g>

      <!-- Japanese Achievement Box -->
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="312" height="52" rx="4" fill="#FF654F" stroke="#171717" stroke-width="2"/>
        <text x="14" y="22" fill="#FFFFFF" font-size="11.5" font-weight="900" class="mono-font">🇯🇵 Japanese (日本語)</text>
        <text x="14" y="40" fill="#F5D547" font-size="9.5" font-weight="800" class="mono-font">🏆 JLPT N5 COMPLETED ✦ PREPARING N4</text>
      </g>
    </g>
  </g>
</svg>